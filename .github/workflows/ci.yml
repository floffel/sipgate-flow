name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo test --no-default-features
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Ratchet: it was 85, the suite is at 98.4 % lines, so the gate moves to
      # 95 to leave room for a genuinely environment-bound line (a DNS failure
      # branch) without letting a regression through.
      - run: cargo llvm-cov --all-features --lcov --output-path lcov.info --fail-under-lines 95
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: lcov.info

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # The default musl target cannot be combined with ASAN (`statically
      # linked libc`), so build for the host triple instead.
      # Named targets: parse_event, parse_token, parse_rest (see fuzz/fuzz_targets).
      - run: cargo fuzz build --target x86_64-unknown-linux-gnu

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
