[package]
name = "sipgate-flow"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0 OR MIT"
description = "Typed, tolerant client for sipgate voice-flow events and actions"
repository = "https://github.com/floffel/sipgate-flow"
documentation = "https://docs.rs/sipgate-flow"
keywords = ["sipgate", "voice", "telephony", "webhook"]
categories = ["api-bindings", "web-programming"]
readme = "README.md"
exclude = [".github/**", "deny.toml"]

[features]
default = ["http"]
http = ["dep:reqwest"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
