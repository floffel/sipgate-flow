[package]
name = "sipgate-flow"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0 OR MIT"
description = "Typed, tolerant client for sipgate flow, the classic Push API and the sipgate REST API v2"
repository = "https://github.com/floffel/sipgate-flow"
documentation = "https://docs.rs/sipgate-flow"
keywords = ["sipgate", "voice", "telephony", "webhook"]
categories = ["api-bindings", "web-programming"]
readme = "README.md"
exclude = [".github/**", "deny.toml"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
http = ["dep:reqwest", "dep:serde_urlencoded"]
websocket = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
subtle = "2"
mime = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls"], optional = true }
serde_urlencoded = { version = "0.7", optional = true }
base64 = { version = "0.23", default-features = false, features = ["std"] }
url = "2"
httpdate = "1.0.3"

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
