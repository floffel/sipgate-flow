[package]
name = "sipgate-flow-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
tokio = { version = "1", features = ["rt"] }

[dependencies.sipgate-flow]
path = ".."
features = ["websocket"]

[[bin]]
name = "parse_event"
path = "fuzz_targets/parse_event.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_base64"
path = "fuzz_targets/parse_base64.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_token"
path = "fuzz_targets/parse_token.rs"
test = false
doc = false
bench = false
[[bin]]
name = "parse_rest"
path = "fuzz_targets/parse_rest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_socket"
path = "fuzz_targets/parse_socket.rs"
test = false
doc = false
bench = false
